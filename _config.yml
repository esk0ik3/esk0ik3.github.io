author: "esk0ik3"
logo: go_back_home.png
execute:
  execute_notebooks: off

html:
  # 【必須】ボタンを表示するために、以下の2行でリポジトリの場所を指定します
  repository_url: "https://github.com/esk0ik3/esk0ik3.github.io"
  repository_branch: "main"

  # 手動ダークモード切り替えボタンの非表示設定
  theme_config:
    theme_dev_mode: false
    header_buttons_omit_dark_mode: true
    use_repository_button: true  # これらを使うために上のURLが必要です
    use_edit_page_button: true
    use_issues_button: true