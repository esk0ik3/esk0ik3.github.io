name: deploy-book

on:
  push:
    branches:
      - main  # または master

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install jupyter-book
          # 他にコード実行に必要なライブラリ（numpy, matplotlib等）があれば追記
      - name: Build the book
        run: |
          jupyter-book build .
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _build/html
